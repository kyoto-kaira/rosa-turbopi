services:
  rosa:
    build: .
    # Linux/Pi: reach the existing rosbridge without touching its container.
    network_mode: host
    env_file: .env
    environment:
      ROBOT_BACKEND: ${ROBOT_BACKEND:-rosbridge}
    stdin_open: true
    tty: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config:/app/config:ro

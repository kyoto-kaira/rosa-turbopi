services:
  rosa:
    build: .
    # Linux/Pi: reach the existing rosbridge without touching its container.
    network_mode: host
    env_file: .env
    stdin_open: true
    tty: true
    read_only: true
    # Persist model weights, text encoders and library caches across --rm runs.
    volumes:
      - vision-data:/data
      # Host models and preloaded text encoders (e.g. mobileclip2_b.ts).
      - ./weights:/data/weights
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  vision-data:
